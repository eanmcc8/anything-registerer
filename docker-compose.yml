services:
  app:
    build: .
    ports:
      - "8000:8000"   # FastAPI / Web UI
      - "6080:6080"   # noVNC (headed browser preview)
    environment:
      - DISPLAY=:99
      # Optional: set VNC password, leave unset for no password
      # - VNC_PASSWORD=changeme
    volumes:
      - ./data:/app/data   # Persistent SQLite database
    restart: unless-stopped
